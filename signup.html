<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#202124">
  <meta name="msapplication-TileColor" content="#202124">
  <title>Sign Up — RENOVA Painting & Renovation</title>
  <meta name="description" content="Create your RENOVA account to book free site visits, track projects, and manage your renovation journey.">
  <link rel="canonical" href="signup.html">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/hero-center.css">
  <link rel="stylesheet" href="assets/css/section-align.css">
  <link rel="stylesheet" href="assets/css/visual-polish.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    .login-card {
      max-width: 460px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--bd);
      border-radius: var(--r-xl);
      padding: var(--sp-10) var(--sp-8);
      box-shadow: var(--sh-lg);
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      margin-bottom: var(--sp-5);
    }
    .login-terms {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-2);
      font-size: var(--fs-13);
      color: var(--tx-2);
      cursor: pointer;
      margin-bottom: var(--sp-6);
      line-height: 1.6;
    }
    .login-terms input { accent-color: var(--ac); width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; }
    .login-terms a { color: var(--ac); font-weight: var(--fw-semi); }
    .login-divider {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      margin: var(--sp-6) 0;
      color: var(--tx-3);
      font-size: var(--fs-12);
      letter-spacing: var(--ls-widest);
      text-transform: uppercase;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--bd);
    }
    .login-socials {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
    }
    .btn-social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: 12px 16px;
      border: 1px solid var(--bd);
      border-radius: var(--r-lg);
      background: var(--bg-card);
      color: var(--tx-1);
      font-size: var(--fs-13);
      font-weight: var(--fw-semi);
      transition: var(--tr);
    }
    .btn-social:hover { border-color: var(--bd-strong); background: var(--bg-alt); }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: var(--sp-2);
    }
    .auth-brand__mark {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: inline-block;
    }
    .auth-brand__text {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 0.09em;
      color: var(--tx-1);
      line-height: 1;
    }
    .auth-brand__text span { color: var(--ac); }
    .auth-brand__tag {
      font-size: var(--fs-11);
      font-weight: var(--fw-semi);
      letter-spacing: var(--ls-widest);
      text-transform: uppercase;
      color: var(--tx-3);
      margin: 0 0 var(--sp-6);
    }
    @media (max-width: 480px) {
      .login-card { padding: var(--sp-7) var(--sp-5); }
      .login-socials { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <div class="preloader__logo">RENOVA</div>
      <div class="preloader__bar"></div>
    </div>
  </div>
  <div class="page-transition" aria-hidden="true"></div>
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18,15 12,9 6,15"/></svg>
  </button>
  <main>
<!-- SIGNUP FORM -->
    <section class="section" aria-label="Signup form" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 0;background:var(--bg);">
      <div class="container">
        <div class="login-card reveal">
          <div style="text-align:center;margin-bottom:var(--sp-8)">
            <a href="index.html" class="auth-brand" aria-label="RENOVA — back to home">
              <span class="auth-brand__mark" aria-hidden="true">
                <img src="assets/img/logo-mark.svg" alt="" class="logo-mark logo-mark--dark" width="40" height="40" loading="eager" decoding="async">
                <img src="assets/img/logo-mark-light.svg" alt="" class="logo-mark logo-mark--light" width="40" height="40" loading="eager" decoding="async">
              </span>
              <span class="auth-brand__text">RENO<span>VA</span></span>
            </a>
            <p class="auth-brand__tag">Artisan Painting &amp; Renovation</p>
            <h2 style="font-family:var(--serif);font-size:var(--fs-28);color:var(--tx-1);margin-bottom:var(--sp-2)">Create your account</h2>
            <p style="font-size:var(--fs-14);color:var(--tx-3)">Join RENOVA to book visits and track projects</p>
          </div>

          <form data-validate aria-label="Signup form" id="signupForm" novalidate>
            <div class="login-field">
              <label class="form-label" for="signup-name">Full Name <span aria-hidden="true" style="color:var(--ac)">*</span></label>
              <input type="text" id="signup-name" name="name" class="form-input" placeholder="Priya Sharma" autocomplete="name" required>
              <div class="form-error" role="alert"></div>
            </div>
            <div class="login-field">
              <label class="form-label" for="signup-email">Email Address <span aria-hidden="true" style="color:var(--ac)">*</span></label>
              <input type="email" id="signup-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
              <div class="form-error" role="alert"></div>
            </div>
            <div class="login-field">
              <label class="form-label" for="signup-password">Password <span aria-hidden="true" style="color:var(--ac)">*</span></label>
              <input type="password" id="signup-password" name="password" class="form-input" placeholder="Min. 8 characters" autocomplete="new-password" minlength="8" required>
              <div class="form-error" role="alert"></div>
            </div>
            <div class="login-field">
              <label class="form-label" for="signup-confirm">Confirm Password <span aria-hidden="true" style="color:var(--ac)">*</span></label>
              <input type="password" id="signup-confirm" name="confirm" class="form-input" placeholder="Repeat your password" autocomplete="new-password" required>
              <div class="form-error" role="alert"></div>
            </div>

            <label class="login-terms">
              <input type="checkbox" id="terms" name="terms" required>
              <span>I agree to the <a href="terms.html">Terms</a> and <a href="privacy-policy.html">Privacy Policy</a></span>
            </label>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Create account</button>

            <div class="login-divider">or continue with</div>

            <div class="login-socials">
              <button type="button" class="btn-social" aria-label="Continue with Google">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 0 1-2.2 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.97 6.97 0 0 1 5.46 12c0-.73.13-1.43.36-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
              </button>
              <button type="button" class="btn-social" aria-label="Continue with Apple">
                <svg viewBox="0 0 384 512" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                Apple
              </button>
            </div>

            <p style="text-align:center;margin-top:var(--sp-8);font-size:var(--fs-14);color:var(--tx-3)">
              Already have an account? <a href="login.html" style="color:var(--ac);font-weight:600">Sign in</a>
            </p>
          </form>
        </div>

        <p style="text-align:center;margin-top:var(--sp-8);margin-inline:auto;font-size:var(--fs-13);color:var(--tx-3);display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;width:100%;max-width:100%">
          <span>Protected by reCAPTCHA</span><span aria-hidden="true">·</span><a href="privacy-policy.html" style="color:var(--ac)">Privacy Policy</a><span aria-hidden="true">·</span><a href="terms.html" style="color:var(--ac)">Terms</a>
        </p>
      </div>
    </section>

  </main>
<script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/animations.js"></script>
  <script>
    document.getElementById('signupForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const pw = form.querySelector('#signup-password').value;
      const confirm = form.querySelector('#signup-confirm').value;
      const confirmErr = form.querySelector('#signup-confirm').closest('.login-field').querySelector('.form-error');
      if (pw !== confirm) {
        confirmErr.textContent = 'Passwords do not match.';
        return;
      }
      confirmErr.textContent = '';
      const btn = form.querySelector('button[type="submit"]');
      if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
      btn.textContent = 'Creating account…';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = '✓ Account created — Redirecting';
        btn.style.background = '#22c55e';
        btn.style.borderColor = '#22c55e';
        setTimeout(() => window.location.href = 'index.html', 900);
      }, 800);
    });
    // Social signup via Google/Apple → redirect to home page as well
    document.querySelectorAll('.btn-social').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
        btn.innerHTML = '✓ Redirecting…';
        btn.style.background = '#22c55e';
        btn.style.color = '#fff';
        btn.style.borderColor = '#22c55e';
        btn.disabled = true;
        setTimeout(() => window.location.href = 'index.html', 600);
      });
    });
    // Browser back after redirect: bfcache restores mutated buttons, so reset them
    window.addEventListener('pageshow', (e) => {
      if (!e.persisted) return;
      document.querySelectorAll('.btn-social').forEach(btn => {
        if (btn.dataset.origHtml) {
          btn.innerHTML = btn.dataset.origHtml;
          btn.disabled = false;
          btn.style.background = '';
          btn.style.color = '';
          btn.style.borderColor = '';
        }
      });
      const submit = document.querySelector('#signupForm button[type="submit"]');
      if (submit && submit.dataset.orig) {
        submit.textContent = submit.dataset.orig;
        submit.disabled = false;
        submit.style.background = '';
        submit.style.borderColor = '';
      }
    });
  </script>
</body>
</html>
