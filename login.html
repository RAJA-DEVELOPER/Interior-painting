<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#202124">
  <meta name="msapplication-TileColor" content="#202124">
  <title>Login — RENOVA Painting & Renovation</title>
  <meta name="description" content="Login to your RENOVA account to track projects, view quotes, and manage your renovation journey.">
  <link rel="canonical" href="login.html">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/hero-center.css">
  <link rel="stylesheet" href="assets/css/section-align.css">
  <link rel="stylesheet" href="assets/css/visual-polish.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    .login-card {
      max-width: 460px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--bd);
      border-radius: var(--r-xl);
      padding: var(--sp-10) var(--sp-8);
      box-shadow: var(--sh-lg);
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      margin-bottom: var(--sp-5);
    }
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
      flex-wrap: wrap;
    }
    .login-remember {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: var(--fs-13);
      color: var(--tx-2);
      cursor: pointer;
    }
    .login-remember input { accent-color: var(--ac); width: 16px; height: 16px; }
    .login-forgot {
      font-size: var(--fs-13);
      color: var(--ac);
      font-weight: var(--fw-semi);
      transition: color var(--dur-200);
    }
    .login-forgot:hover { color: var(--ac-h); }
    .login-divider {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      margin: var(--sp-6) 0;
      color: var(--tx-3);
      font-size: var(--fs-12);
      letter-spacing: var(--ls-widest);
      text-transform: uppercase;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--bd);
    }
    .login-socials {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
    }
    .btn-social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: 12px 16px;
      border: 1px solid var(--bd);
      border-radius: var(--r-lg);
      background: var(--bg-card);
      color: var(--tx-1);
      font-size: var(--fs-13);
      font-weight: var(--fw-semi);
      transition: var(--tr);
    }
    .btn-social:hover { border-color: var(--bd-strong); background: var(--bg-alt); }
    @media (max-width: 480px) {
      .login-card { padding: var(--sp-7) var(--sp-5); }
      .login-socials { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <div class="preloader__logo">RENOVA</div>
      <div class="preloader__bar"></div>
    </div>
  </div>
  <div class="page-transition" aria-hidden="true"></div>
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18,15 12,9 6,15"/></svg>
  </button>
  <main>
<!-- LOGIN FORM -->
    <section class="section" aria-label="Login form" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 0;background:var(--bg);">
      <div class="container">
        <div class="login-card reveal">
          <div style="text-align:center;margin-bottom:var(--sp-8)">
            <div style="width:56px;height:56px;border-radius:50%;background:var(--ac-light);color:var(--ac);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="28" height="28" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <h2 style="font-family:var(--serif);font-size:var(--fs-28);color:var(--tx-1);margin-bottom:var(--sp-2)">Sign in to your account</h2>
            <p style="font-size:var(--fs-14);color:var(--tx-3)">Enter your credentials to continue</p>
          </div>

          <form data-validate aria-label="Login form" id="loginForm" novalidate>
            <div class="login-field">
              <label class="form-label" for="login-email">Email Address <span aria-hidden="true" style="color:var(--ac)">*</span></label>
              <input type="email" id="login-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
              <div class="form-error" role="alert"></div>
            </div>
            <div class="login-field">
              <label class="form-label" for="login-password">Password <span aria-hidden="true" style="color:var(--ac)">*</span></label>
              <input type="password" id="login-password" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
              <div class="form-error" role="alert"></div>
            </div>

            <div class="login-options">
              <label class="login-remember">
                <input type="checkbox" id="remember" name="remember">
                Remember me
              </label>
              <a href="#" class="login-forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Login</button>

            <div class="login-divider">or continue with</div>

            <div class="login-socials">
              <button type="button" class="btn-social" aria-label="Continue with Google">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 0 1-2.2 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.97 6.97 0 0 1 5.46 12c0-.73.13-1.43.36-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
              </button>
              <button type="button" class="btn-social" aria-label="Continue with Apple">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.34-2.365-2.04-.165-4.044 1.2-5.159 1.2zM12.152 4.5c.33-.438 1.023-2.358.43-4.5-1.275.045-2.857.85-3.78 1.91-.89 1.021-1.67 2.652-1.46 4.216 1.54.12 3.11-.78 4.01-1.91l.8-1.716z"/></svg>
                Apple
              </button>
            </div>

            <p style="text-align:center;margin-top:var(--sp-8);font-size:var(--fs-14);color:var(--tx-3)">
              Don't have an account? <a href="#" style="color:var(--ac);font-weight:600">Create account</a>
            </p>
          </form>
        </div>

        <p style="text-align:center;margin-top:var(--sp-8);margin-inline:auto;font-size:var(--fs-13);color:var(--tx-3);display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;width:100%;max-width:100%">
          <span>Protected by reCAPTCHA</span><span aria-hidden="true">·</span><a href="privacy-policy.html" style="color:var(--ac)">Privacy Policy</a><span aria-hidden="true">·</span><a href="terms.html" style="color:var(--ac)">Terms</a>
        </p>
      </div>
    </section>

  </main>
<script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/animations.js"></script>
  <script>
    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const orig = btn.textContent;
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = '✓ Signed in — Redirecting';
        btn.style.background = '#22c55e';
        btn.style.borderColor = '#22c55e';
        setTimeout(() => window.location.href = 'index.html', 900);
      }, 800);
    });
    // Social login via Google/Apple → redirect to home page as well
    document.querySelectorAll('.btn-social').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const original = btn.innerHTML;
        btn.innerHTML = '✓ Redirecting…';
        btn.style.background = '#22c55e';
        btn.style.color = '#fff';
        btn.style.borderColor = '#22c55e';
        btn.disabled = true;
        setTimeout(() => window.location.href = 'index.html', 600);
      });
    });
  </script>
</body>
</html>
