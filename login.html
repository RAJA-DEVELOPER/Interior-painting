<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#202124">
  <meta name="msapplication-TileColor" content="#202124">
  <title>Login — RENOVA Painting & Renovation</title>
  <meta name="description" content="Login to your RENOVA account to track projects, view quotes, and manage your renovation journey.">
  <link rel="canonical" href="login.html">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/hero-center.css">
  <link rel="stylesheet" href="assets/css/section-align.css">
  <link rel="stylesheet" href="assets/css/visual-polish.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    /* ── Minimal clean auth ── */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 20px;
      background: var(--bg);
    }
    .auth-wrap { width: 100%; max-width: 400px; margin: 0 auto; }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .auth-brand__mark {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: inline-block;
    }
    .auth-brand__text {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.09em;
      color: var(--tx-1);
      line-height: 1;
    }
    .auth-brand__text span { color: var(--ac); }
    .auth-title {
      font-family: var(--serif);
      font-size: var(--fs-32);
      font-weight: 400;
      color: var(--tx-1);
      text-align: center;
      margin: var(--sp-6) 0 var(--sp-2);
    }
    .auth-sub {
      font-size: var(--fs-14);
      color: var(--tx-3);
      text-align: center;
      margin: 0 0 var(--sp-8);
    }
    .auth-field {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      margin-bottom: var(--sp-5);
    }
    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
      flex-wrap: wrap;
    }
    .auth-remember {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: var(--fs-13);
      color: var(--tx-2);
      cursor: pointer;
    }
    .auth-remember input { accent-color: var(--ac); width: 16px; height: 16px; }
    .auth-forgot {
      font-size: var(--fs-13);
      color: var(--ac);
      font-weight: var(--fw-semi);
      text-decoration: none;
    }
    .auth-forgot:hover { color: var(--ac-h); }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      margin: var(--sp-8) 0 var(--sp-6);
      color: var(--tx-3);
      font-size: var(--fs-12);
      letter-spacing: var(--ls-widest);
      text-transform: uppercase;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--bd);
    }
    .auth-socials {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .btn-social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      padding: 13px 16px;
      border: 1px solid var(--bd);
      border-radius: var(--r-lg);
      background: var(--bg-card);
      color: var(--tx-1);
      font-size: var(--fs-14);
      font-weight: var(--fw-semi);
      transition: var(--tr);
      width: 100%;
    }
    .btn-social:hover { border-color: var(--bd-strong); background: var(--bg-alt); }
    .auth-switch {
      text-align: center;
      margin-top: var(--sp-8);
      font-size: var(--fs-14);
      color: var(--tx-3);
    }
    .auth-switch a { color: var(--ac); font-weight: 600; text-decoration: none; }
    .auth-legal {
      text-align: center;
      margin-top: var(--sp-10);
      font-size: var(--fs-12);
      color: var(--tx-3);
    }
    .auth-legal a { color: var(--ac); text-decoration: none; }
  </style>
</head>
<body>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <div class="preloader__logo">RENOVA</div>
      <div class="preloader__bar"></div>
    </div>
  </div>
  <div class="page-transition" aria-hidden="true"></div>

  <main>
    <section class="auth-page" aria-label="Login form">
      <div class="auth-wrap reveal">
        <a href="index.html" class="auth-brand" aria-label="RENOVA — back to home">
          <span class="auth-brand__mark" aria-hidden="true">
            <img src="assets/img/logo-mark.svg" alt="" class="logo-mark logo-mark--dark" width="36" height="36" loading="eager" decoding="async">
            <img src="assets/img/logo-mark-light.svg" alt="" class="logo-mark logo-mark--light" width="36" height="36" loading="eager" decoding="async">
          </span>
          <span class="auth-brand__text">RENO<span>VA</span></span>
        </a>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to continue to RENOVA</p>

        <form data-validate aria-label="Login form" id="loginForm" novalidate>
          <div class="auth-field">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" id="login-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
            <div class="form-error" role="alert"></div>
          </div>
          <div class="auth-field">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
            <div class="form-error" role="alert"></div>
          </div>

          <div class="auth-options">
            <label class="auth-remember">
              <input type="checkbox" id="remember" name="remember">
              Remember me
            </label>
            <a href="#" class="auth-forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Sign in</button>

          <div class="auth-divider">or</div>

          <div class="auth-socials">
            <button type="button" class="btn-social" aria-label="Continue with Google">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 0 1-2.2 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.97 6.97 0 0 1 5.46 12c0-.73.13-1.43.36-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Continue with Google
            </button>
            <button type="button" class="btn-social" aria-label="Continue with Apple">
              <svg viewBox="0 0 384 512" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
              Continue with Apple
            </button>
          </div>

          <p class="auth-switch">
            New to RENOVA? <a href="signup.html">Create account</a>
          </p>
        </form>

        <p class="auth-legal">
          Protected by reCAPTCHA · <a href="privacy-policy.html">Privacy</a> · <a href="terms.html">Terms</a>
        </p>
      </div>
    </section>
  </main>

<script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/animations.js"></script>
  <script>
    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = '✓ Signed in — Redirecting';
        btn.style.background = '#22c55e';
        btn.style.borderColor = '#22c55e';
        setTimeout(() => window.location.href = 'index.html', 900);
      }, 800);
    });
    // Social login via Google/Apple → redirect to home page as well
    document.querySelectorAll('.btn-social').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
        btn.innerHTML = '✓ Redirecting…';
        btn.style.background = '#22c55e';
        btn.style.color = '#fff';
        btn.style.borderColor = '#22c55e';
        btn.disabled = true;
        setTimeout(() => window.location.href = 'index.html', 600);
      });
    });
    // Browser back after redirect: bfcache restores mutated buttons, so reset them
    window.addEventListener('pageshow', (e) => {
      if (!e.persisted) return;
      document.querySelectorAll('.btn-social').forEach(btn => {
        if (btn.dataset.origHtml) {
          btn.innerHTML = btn.dataset.origHtml;
          btn.disabled = false;
          btn.style.background = '';
          btn.style.color = '';
          btn.style.borderColor = '';
        }
      });
      const submit = document.querySelector('#loginForm button[type="submit"]');
      if (submit && submit.dataset.orig) {
        submit.textContent = submit.dataset.orig;
        submit.disabled = false;
        submit.style.background = '';
        submit.style.borderColor = '';
      }
    });
  </script>
</body>
</html>
